# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Nalini's Notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: nalini.navaproduction.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light:         "#F7F4F9" #page background
        lightgray:     "#EDE6F2" #sidebar + surface backgrounds
        gray:          "#82788c" #"search", dates under headings
        darkgray:      "#6B5080" #text color
        dark:          "#2E1F40" #,main body text and headings
        secondary:     "#8B69A8" #links, active sidebar items, tags
        tertiary:      "#5E4278" #link hover color
        highlight:     "rgba(139, 105, 168, 0.10)" #search + callout wash
        textHighlight: "rgba(139, 105, 168, 0.22)" #selected text highlight
      darkMode:
        light:         "#141420" #page background
        lightgray:     "#1E1D35" #sidebar + surface backgrounds
        gray:          "#79789d" #"search", dates under headings
        darkgray:      "#b5b5c8" #text color
        dark:          "#E8E8F5" #main body text and headings
        secondary:     "#A09EE0" #links, active sidebar items, tags
        tertiary:      "#C8C7F0" #link hover color
        highlight:     "rgba(160, 158, 224, 0.12)" #search + callout wash
        textHighlight: "rgba(160, 158, 224, 0.25)" #selected text highlight
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: bulletin
    layout:
      position: left
      priority: 50
  #- source: github:quartz-community/graph
    #enabled: true
    #layout:
      #position: right
      #priority: 10
  - source: github:quartz-community/backlinks
    enabled: false
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 5
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options:
        repo: TODO:username/repo-name
        repoId: TODO:your-repo-id
        category: Announcements
        categoryId: TODO:your-category-id
        mapping: url
        strict: true
        reactionsEnabled: true
        inputPosition: bottom
        lightTheme: light
        darkTheme: dark
        lang: en
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 10
      order: 10
      group: toolbar
      groupOptions:
        grow: true 
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: Recent Notes
      limit: 3 # 3 most recent notes
      linkToMore: false
      showTags: true
      exclude: ["_index", "404", "not-found", "tag-index"]
    layout:
      position: left
      priority: 25
    order: 20
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 15
      direction: row
      gap: 0.5rem
  byPageType:
    content:
      template: default
      left:
        - github:quartz-community/page-title     # 1. Page Title at the top
        - toolbar                                 # 2. Toolbar (Search + Darkmode) next
        - github:quartz-community/recent-notes    # 3. Recent Notes
        - github:quartz-community/explorer        # 4. File Explorer at the bottom
      right:
        - github:quartz-community/table-of-contents
    folder:
      template: default
      left:
        - github:quartz-community/page-title
        - toolbar
        - github:quartz-community/recent-notes
        - github:quartz-community/explorer
    tag:
      template: default
      left:
        - github:quartz-community/page-title
        - toolbar
        - github:quartz-community/recent-notes
        - github:quartz-community/explorer
      right:
        - github:quartz-community/graph